<footer class="footer mt-auto py-3 bg-light">
    <div class="container text-center">
        <div class="hl-wanted-footer">
            {% if current_user.is_authenticated %}<a href="{{ url_for('profil', user_id=current_user.id) }}">{{ wanted_stars(current_user.id) }}</a>
            {% else %}<span class="hl-wanted" aria-hidden="true">★★★<span class="off">★★</span></span>{% endif %}
        </div>
        <button type="button" class="hl-sound-toggle" id="hl-sound-toggle">🔊 Dźwięki</button>
        <span class="text-muted">© 2024{% if current_year > 2024 %}–{{ current_year }}{% endif %} hlyw.pl</span>
    </div>
</footer>
