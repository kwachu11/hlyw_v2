{% set src = image.file_path|media_url %}
<a href="{{ src }}" class="hl-thumb" data-src="{{ src }}" {% if image.file_path|is_video %}data-video="1"{% endif %}>
    {% if image.file_path|is_video %}
    <video src="{{ src }}#t=0.5" preload="metadata" muted playsinline></video>
    <span class="hl-play">&#9654;</span>
    {% else %}
    <img src="{{ src }}" alt="" loading="lazy">
    {% endif %}
</a>
