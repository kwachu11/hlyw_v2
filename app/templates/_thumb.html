{% set src = image.file_path|media_url %}
{% set like = (likes or {}).get(image.id) %}
<a href="{{ src }}" class="hl-thumb" data-src="{{ src }}" {% if image.file_path|is_video %}data-video="1"{% endif %}
   {% if like %}data-like-id="{{ image.id }}" data-likes="{{ like.count }}" data-liked="{{ 1 if like.mine else 0 }}" data-who="{{ like.who }}"{% endif %}>
    {% if image.file_path|is_video %}
    <video src="{{ src }}#t=0.5" preload="metadata" muted playsinline></video>
    <span class="hl-play">&#9654;</span>
    {% else %}
    <img src="{{ url_for('thumbnail', image_id=image.id) }}" alt="" loading="lazy" decoding="async">
    {% endif %}
    {% if like %}<span class="hl-thumb-likes{% if like.mine %} mine{% endif %}"{% if not like.count %} hidden{% endif %}>&#10084; <b>{{ like.count }}</b></span>{% endif %}
</a>
