<div style="background:#0d0d12;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#eee">
<div style="max-width:560px;margin:0 auto;background:#17171f;border-radius:10px;overflow:hidden">
<div style="background:linear-gradient(90deg,#ff2e88,#ff9d2e);padding:16px 22px">
<div style="font-size:24px;font-weight:bold;color:#fff;letter-spacing:1px">hlyw.pl</div>
</div>
<div style="padding:22px;font-size:15px;line-height:1.6">
{% for p in paragraphs %}<p style="margin:0 0 14px">{{ p|safe }}</p>
{% endfor %}
{% if counter %}<p style="text-align:center;margin:18px 0"><img src="{{ site_url }}gta6/licznik.gif" width="516" alt="Licznik" style="max-width:100%;height:auto;border-radius:8px;display:block;margin:0 auto"></p>
{% endif %}
{% if button_text and button_url %}<p style="text-align:center;margin:24px 0">
<a href="{{ button_url }}" style="background:#ff2e88;color:#fff;text-decoration:none;padding:12px 26px;border-radius:6px;font-weight:bold;display:inline-block">{{ button_text }}</a>
</p>
{% endif %}
<p style="margin:0">Ekipa hlyw.pl</p>
</div>
<div style="padding:12px 22px;font-size:12px;color:#888;border-top:1px solid #2a2a35">Dostajesz tę wiadomość, bo masz konto na <a href="{{ site_url }}" style="color:#ff9d2e">hlyw.pl</a>. <a href="{link_ustawienia}" style="color:#ff9d2e">Zmień, jakie maile dostajesz</a>.</div>
</div></div>
